[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csrd-emt"
version = "0.1.0"
description = "Cross-subject reference distillation for EEG emotion recognition"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Nguyễn Trường An"}]
license = {file = "LICENSE"}
dependencies = ["torch>=2.11,<3", "numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "pandas>=2.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csrd_emt = ["seed_hashes.json"]
